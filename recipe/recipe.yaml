# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"
  python_check_max: "3.14"

package:
  name: ossindex-lib
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/ossindex-lib/ossindex_lib-${{ version }}.tar.gz
  sha256: 95104edd69466fe07d1b5748d8eda4dbc95b3e8e3bf400440680e79d30c664cb

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python ${{ python_min }}.*
  run:
    - packageurl-python >=0.9.0,<0.10.0
    - python >=${{ python_min }},<4.0
    - pyyaml >=5.4.1,<7
    - requests >=2.20.0,<3.0.0
    - tinydb >=4.5.0,<5.0.0
    - types-pyyaml >=5.4.1,<6.0.0
    - types-requests >=2.25.1,<3.0.0
    - types-setuptools >=57.0.0

tests:
  - python:
      imports: ossindex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*

about:
  summary: |-
    A library for querying the OSS Index free catalogue of open source
    components to help developers identify vulnerabilities, understand risk,
    and keep their software safe.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/ossindex-lib
  repository: https://github.com/sonatype-nexus-community/ossindex-python

extra:
  recipe-maintainers:
    - bollwyvl
